# Quest 1 Passthrough Colorizer
#
# Change a value, then run:  ptcolor apply
# (or just reboot, the module re-applies itself every boot)

# Master switch. 0 restores the stock passthrough shader.
ENABLED=1

# Passthrough is greyscale, so this is what white becomes.
#   #66CCFF  ice blue       #FFB347  amber
#   #55FF88  night vision   #FF6699  pink
TINT_COLOR=#66CCFF

# How far towards the colour. 0.0 = untouched grey, 1.0 = full tint.
STRENGTH=1.0

# Gain after the tint. Tinting darkens, so raise this to compensate.
# Above 1.0 will clip.
BRIGHTNESS=1.0
